<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>栀笼 Gardenia Cage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 主菜单（标题界面） -->
  <div id="main-menu" class="hidden">
    <div class="menu-shade"></div>
    <div class="menu-content">
      <h1 id="menu-title" data-text="栀 笼">栀 笼</h1>
      <div id="menu-subtitle">— Gardenia Cage —</div>
      <div id="menu-tagline">「一生的守候。」</div>
      <nav class="menu-buttons">
        <button id="menu-start" class="menu-btn">开始游戏</button>
        <button id="menu-continue" class="menu-btn">读取存档</button>
        <button id="menu-gallery" class="menu-btn">鉴赏</button>
        <button id="menu-settings" class="menu-btn">设置</button>
        <button id="menu-quit" class="menu-btn">退出</button>
      </nav>
      <div id="menu-footnote">本作包含心理恐怖元素 · 请酌情游玩</div>
    </div>
  </div>

  <!-- 顶部菜单按钮栏 -->
  <div id="topbar">
    <div id="auto-indicator" class="hidden">▶ 自动</div>
    <button class="top-btn" data-panel="history">历史 <span class="key">H</span></button>
    <button class="top-btn" data-panel="save">存档</button>
    <button class="top-btn" data-panel="load">读档</button>
    <button class="top-btn" data-panel="settings">设置</button>
    <button class="top-btn" data-panel="gallery">鉴赏</button>
    <button id="story-toggle" class="top-btn">剧情</button>
  </div>

  <!-- 剧情调试管理器 -->
  <div id="story-bar" class="hidden">
    <div class="story-main-row">
      <span id="story-position" class="story-position"></span>
      <input id="story-progress" type="range" min="0" max="0" value="0" step="1" disabled>
      <span id="story-total" class="story-total"></span>
    </div>
    <div class="story-sub-row">
      <select id="story-scene-select" aria-label="剧情场景"></select>
      <button id="story-jump-scene">跳到场景</button>
      <div id="story-command-label"></div>
      <button id="story-close">收起</button>
    </div>
  </div>

  <!-- 选择支 -->
  <div id="choices" class="hidden"></div>

  <!-- 对话框 -->
  <div id="dialogue-box">
    <div id="speaker-name" class="hidden"><span id="speaker-text"></span></div>
    <div id="dialogue-text"></div>
    <div id="advance-hint" class="hidden">▼</div>
  </div>

  <!-- 全屏面板容器 -->
  <div id="panel-overlay" class="hidden">
    <div id="panel">
      <div id="panel-header">
        <span id="panel-title"></span>
        <button id="panel-close">✕</button>
      </div>
      <div id="panel-body"></div>
    </div>
  </div>

  <!-- 全屏氛围遮罩（暗角 + 血色呼吸） -->
  <div id="vignette"></div>

  <!-- 右键菜单 -->
  <div id="context-menu" class="hidden">
    <div class="ctx-item" data-action="history">历史记录</div>
    <div class="ctx-item" data-action="save">存档</div>
    <div class="ctx-item" data-action="load">读档</div>
    <div class="ctx-item" data-action="settings">设置</div>
    <div class="ctx-item" data-action="gallery">鉴赏</div>
    <div class="ctx-item" data-action="story">剧情管理器</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-action="auto"><span id="ctx-auto-check"></span>自动模式</div>
    <div class="ctx-item" data-action="close">关闭菜单</div>
  </div>

  <script src="ui.js"></script>
</body>
</html>
